<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header class="header">
            <h1>Universal <span>Downloader</span></h1>
            <p>Download videos from almost any platform instantly.</p>
        </header>

        <section class="downloader-card">
            <form id="download-form" class="input-group">
                <input type="url" id="url-input" placeholder="Paste your video link here (e.g. YouTube, Twitter, Vimeo...)" required autocomplete="off">
                <button type="submit" id="download-btn">
                    <span class="btn-text">Download</span>
                    <div class="loader hidden" id="btn-loader"></div>
                </button>
            </form>
            
            <div class="terminal-container hidden" id="terminal-container">
                <div class="terminal-header">
                    <div class="terminal-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="terminal-title">Download Progress</div>
                </div>
                <div class="terminal-body" id="terminal-output"></div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
